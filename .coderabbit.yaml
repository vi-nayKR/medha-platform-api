language: en
reviews:
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*.go"
      instructions: |
        Focus on Go best practices, error handling, and concurrency safety.
        Check for proper resource cleanup (defer), context propagation, and
        SQL injection risks. Verify that all exported functions have doc comments.
    - path: "internal/domain/**"
      instructions: |
        Domain entities must remain free of infrastructure concerns.
        No imports from repository or handler packages.
    - path: "internal/handler/**"
      instructions: |
        Handlers should only validate input and delegate to services.
        Check for proper HTTP status codes and response formatting.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
chat:
  auto_reply: true
