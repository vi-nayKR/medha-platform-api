  /api/v2/user/check-username:
    get:
      description: Checks if a username is already taken. This endpoint is public.
      parameters:
      - description: Username to check
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Username check result
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/CheckUsernameExistsResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/ProblemDetail'
      summary: Check username availability
      tags:
      - user-v2
  /api/v2/user/me:
    delete:
      description: Permanently deletes the authenticated user's account and all associated
        data.
      produces:
      - application/json
      responses:
        "200":
          description: Account deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to delete account. Please try again.
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete user account
      tags:
      - user-v2
  /api/v2/user/me/location:
    get:
      description: Returns the currently stored home location for the authenticated
        user. Used to seed the map on startup.
      produces:
      - application/json
      responses:
        "200":
          description: User location
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/LocationResponseV2'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ProblemDetail'
        "404":
          description: Location not found
          schema:
            $ref: '#/definitions/ProblemDetail'
      security:
      - BearerAuth: []
      summary: Get user location
      tags:
      - user-v2
    put:
      consumes:
      - application/json
      description: Updates the user's geographic location natively translating to
        PostGIS coordinates. Returns the full profile.
      parameters:
      - description: Location data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LocationUpdateRequestV2'
      produces:
      - application/json
      responses:
        "200":
          description: Location updated
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/ProfileResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/ProblemDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ProblemDetail'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/ProblemDetail'
      security:
      - BearerAuth: []
      summary: Update user location
      tags:
      - user-v2
  /api/v2/user/me/profile:
    get:
      description: Returns the current user's profile including pandit profile if
        applicable.
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/ProfileResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ProblemDetail'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/ProblemDetail'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - user-v2
    post:
      consumes:
      - application/json
      description: Sets the user's first name, last name, and role, marking the profile
        as complete.
      parameters:
      - description: Profile data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/SetupProfileRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Profile set up
          schema:
            allOf:
            - $ref: '#/definitions/DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/ProfileResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/ProblemDetail'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ProblemDetail'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/ProblemDetail'
      security:
      - BearerAuth: []
      summary: Setup user profile
      tags:
      - user-v2
securityDefinitions:
  AdminToken:
    description: Type "Bearer" followed by a space and an admin JWT or break-glass
      token.
    in: header
    name: Authorization
    type: apiKey
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
