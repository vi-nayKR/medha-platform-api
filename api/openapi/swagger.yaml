    get:
      consumes:
      - application/json
      description: 'Validates the 6-digit OTP. Creates a new user if not found, or
        logs in the existing user. Returns the unified auth response. Note: This is
        an HTTP GET request, so phone and otp must be sent as query parameters.'
      parameters:
      - description: Phone number in E.164 format
        example: '"+919999999999"'
        in: query
        name: phone
        required: true
        type: string
      - description: 6-digit OTP
        example: '"123456"'
        in: query
        name: otp
        required: true
