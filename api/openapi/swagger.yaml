      consumes:
      - application/json
      description: Creates or updates the professional profile of the authenticated
        pandit. Only users with role=pandit can call this endpoint. All fields are
        optional — send only what you want to update.
      parameters:
      - description: Pandit profile data
        in: body
        name: body
        required: true
        schema:
