version: "2"

run:
  modules-download-mode: readonly
  go: "1.25"


linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - bodyclose
    - nilerr
    - copyloopvar
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/medha/backend
