name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medha_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEDHA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/medha_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Tests with Race Detector
        run: go test -race -v ./...

      - name: Build Binary
        run: CGO_ENABLED=0 go build -v -o bin/medha-api ./cmd/medha-api
