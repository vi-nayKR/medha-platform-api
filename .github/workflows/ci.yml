name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Tests with Race Detector
        run: go test -race -v ./...

      - name: Build Binary
        run: CGO_ENABLED=0 go build -v -o bin/medha-api ./cmd/medha-api
