name: Publication safety

on:
  push:
    branches: [main, dev, 'security/**']
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public snapshot boundaries
        run: python3 scripts/check-publication.py
      - name: Scan checked-out files with Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          tools=$(mktemp -d)
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$tools/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tools/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
          "$tools/gitleaks" dir --redact=100 --no-banner .
